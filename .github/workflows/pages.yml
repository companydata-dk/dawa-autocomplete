name: Demo site

# Builds the package and publishes the demo at
# https://companydata-dk.github.io/dawa-autocomplete/ on every push to main.
# The demo talks to the live dawa.companydata.dk, so the page doubles as a
# smoke test of the host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p site/html
          cp -r dist/js site/js
          cp -r dist/css site/css
          cp html/index.html site/index.html
          cp html/demo.html site/html/demo.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
